name: Backend CI and deploy

on:
  pull_request:
    paths:
      - 'api/geneatree/**'
      - 'render.yaml'
      - '.github/workflows/backend-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'api/geneatree/**'
      - 'render.yaml'
      - '.github/workflows/backend-deploy.yml'

permissions:
  contents: read

concurrency:
  group: geneatree-backend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api/geneatree
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Test backend
        run: ./mvnw --batch-mode test
      - name: Build production container
        run: docker build --tag geneatree-api:${{ github.sha }} .

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --show-error --silent --request POST "$RENDER_DEPLOY_HOOK_URL"
