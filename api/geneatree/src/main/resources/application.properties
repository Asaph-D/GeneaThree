spring.application.name=geneatree
# Server port
server.port=${PORT:8086}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geneatree}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# Use 'update' for production to avoid dropping tables
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
spring.main.lazy-initialization=${SPRING_MAIN_LAZY_INITIALIZATION:false}

# Logging
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN
logging.level.org.springframework.web=${SPRING_WEB_LOG_LEVEL:WARN}
spring.mvc.log-request-details=false

# Security
server.forward-headers-strategy=framework
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict

# OpenAPI/Swagger configuration
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:true}
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:true}


app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

# G2TPay Mobile Money Cameroon
order.g2tpay.enabled=${G2TPAY_ENABLED:true}
order.g2tpay.api-key=${G2TPAY_API_KEY:}
order.g2tpay.base-url=${G2TPAY_BASE_URL:https://g2tpay.net}
order.g2tpay.webhook-url=${G2TPAY_WEBHOOK_URL:}
order.g2tpay.gateway-public-url=${GATEWAY_PUBLIC_URL:}
order.g2tpay.eur-to-xaf-rate=${G2TPAY_EUR_TO_XAF_RATE:655.957}
order.g2tpay.operator-mtn=${G2TPAY_OPERATOR_MTN:MTN_CMR}
order.g2tpay.operator-orange=${G2TPAY_OPERATOR_ORANGE:ORANGE_CMR}

# CinetPay hosted card checkout (card numbers never transit through this application)
order.cinetpay.enabled=${CINETPAY_ENABLED:false}
order.cinetpay.api-key=${CINETPAY_API_KEY:}
order.cinetpay.site-id=${CINETPAY_SITE_ID:}
order.cinetpay.base-url=${CINETPAY_BASE_URL:https://api-checkout.cinetpay.com}
order.cinetpay.notify-url=${CINETPAY_NOTIFY_URL:}
order.cinetpay.return-url=${CINETPAY_RETURN_URL:}

