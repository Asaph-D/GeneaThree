spring.application.name=geneatree
# Server port
server.port=${PORT:8086}

# Database configuration
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/geneatree}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# Hibernate properties
spring.jpa.hibernate.ddl-auto=update
# Use 'update' for production to avoid dropping tables
# spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# Logging
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG_LEVEL:WARN}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Security
# spring.security.user.name=admin
# spring.security.user.password=admin
# spring.security.user.roles=ADMIN

# OpenAPI/Swagger configuration
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.url=/v3/api-docs
springdoc.swagger-ui.enabled=true


app.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

