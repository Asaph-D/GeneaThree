services:
  - type: web
    name: geneatree-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: true
    rootDir: api/geneatree
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
      - key: SPRING_MAIN_LAZY_INITIALIZATION
        value: "true"
      - key: SPRINGDOC_ENABLED
        value: "false"
      - key: G2TPAY_ENABLED
        value: "true"
      - key: G2TPAY_API_KEY
        sync: false
      - key: G2TPAY_WEBHOOK_URL
        value: "https://geneathree.onrender.com/api/payments/g2tpay/callback"
      - key: G2TPAY_PENDING_TIMEOUT_SECONDS
        value: "180"
      - key: GATEWAY_PUBLIC_URL
        value: "https://geneathree.onrender.com"
      - key: CINETPAY_ENABLED
        value: "false"
