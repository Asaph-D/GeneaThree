services:
  - type: web
    name: geneatree-api
    runtime: docker
    plan: free
    branch: main
    autoDeploy: false
    rootDir: api/geneatree
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGIN
        sync: false
      - key: JPA_SHOW_SQL
        value: "false"
